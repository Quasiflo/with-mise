---
name: Run Task
description: |
  This action installs mise tools & dependencies and executes your commands.
inputs:
  use_cache:
    required: false
    default: 'false'
    description: Cache mise tool dependencies
  strict_mode:
    required: false
    default: 'true'
    description: Runs `mise install --locked`, avoiding implicit dependency changes during resolution
  use_tools:
    required: false
    default: ""
    description: Comma-separated list of full mise tool IDs to install & activate (as in mise.toml, e.g. "aqua:jdx/hk,node"). All others will be ignored (sets MISE_ENABLE_TOOLS). Mutually exclusive with exclude_tools option.
  exclude_tools:
    required: false
    default: ""
    description: Comma-separated list of full mise tool IDs to exclude from installation (as in mise.toml, e.g. "aqua:jdx/hk"). All others will be included (sets MISE_DISABLE_TOOLS). Mutually exclusive with use_tools option.
  commands:
    required: true
    description: String of commands to run
runs:
  using: composite
  steps:
    - name: Set Global Env Vars
      shell: bash
      run: echo "CI_PLATFORM=github_actions" >> "$GITHUB_ENV"
    - name: Setup CI
      shell: bash
      env:
        SCRIPT_SUBCOMMAND: SETUP
        ACTION_PATH: ${{ github.action_path }}
        STRICT_MODE: ${{ inputs.strict_mode }}
        USE_TOOLS: ${{ inputs.use_tools }}
        EXCLUDE_TOOLS: ${{ inputs.exclude_tools }}
      run: bash "$ACTION_PATH/everything.sh"
    - name: Restore Mise Tools Cache
      id: mise-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.use_cache == 'true'
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ env.TOOLS_CHECKSUM }}-${{ env.FILES_CHECKSUM }}
        restore-keys: |
          mise-${{ runner.os }}-${{ env.TOOLS_CHECKSUM }}
          mise-${{ runner.os }}
    - name: Install Tools
      shell: bash
      env:
        SCRIPT_SUBCOMMAND: INSTALL_TOOLS
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/everything.sh"
    - name: Save Mise Tools Cache
      if: inputs.use_cache == 'true' && steps.mise-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: ${{steps.mise-cache.outputs.cache-primary-key}}
    - name: Run Task
      shell: bash
      env:
        TASK_COMMANDS: ${{ inputs.commands }}
      run: |
        set -euo pipefail
        eval "$(mise activate bash)"
        eval "$TASK_COMMANDS"
